[project]
name = "tool-output-sanitizer"
version = "0.1.0"
description = "Token-level sanitizer for indirect prompt injections in agent tool outputs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "datasets>=3.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "huggingface_hub>=0.26",
]

[project.scripts]
tool-output-sanitizer = "tool_output_sanitizer.cli:main"
tool-output-sanitizer-mcp = "tool_output_sanitizer.mcp_proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_output_sanitizer"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
